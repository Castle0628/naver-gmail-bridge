name: naver-to-gmail
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bridge
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 네이버 새 메일 → 지메일
        env:
          NAVER_APP_PASSWORD: ${{ secrets.NAVER_APP_PASSWORD }}
        run: python bridge.py
      - name: 본 위치 저장
        if: always()
        run: |
          git config user.name "bridge-bot"
          git config user.email "bridge-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "state" -q && git push -q)
